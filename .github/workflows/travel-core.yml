name: travel-core CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/travel-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/${{ github.repository_owner }}/travel-core

jobs:

  # ── TEST ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: backend
        run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test
          AI_PROVIDER: mock         # MockAIAdapter — sin red, sin Ollama

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/**/target/surefire-reports/

  # ── BUILD & PUSH ────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build fat JAR
        working-directory: backend
        run: mvn package -DskipTests -B

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── DEPLOY PILOT (develop → Fly.io) ─────────────────────────
  deploy-pilot:
    name: Deploy Pilot
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: pilot

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: infra/flyio
        run: flyctl deploy --image ${{ env.IMAGE }}:${{ github.sha }} --app travelapp-core
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── DEPLOY PROD (main → K8s) ────────────────────────────────
  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3

      - name: Set K8s context
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig

      - name: Deploy with Kustomize
        run: |
          kubectl --kubeconfig /tmp/kubeconfig \
            set image deployment/travel-core \
            travel-core=${{ env.IMAGE }}:${{ github.sha }} \
            -n travelapp
          kubectl --kubeconfig /tmp/kubeconfig \
            rollout status deployment/travel-core \
            -n travelapp --timeout=120s
