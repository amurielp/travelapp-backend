openapi: 3.1.0

info:
  title: TravelApp API
  version: 1.2.0
  description: |
    API REST de TravelApp. Fuente de verdad — los controllers y DTOs
    de Spring Boot se generan automáticamente desde este fichero
    con openapi-generator en el step `compile` de Maven.
  contact:
    name: TravelApp Team

servers:
  - url: http://localhost:8080/api
    description: Local
  - url: https://api.travelapp.com/api
    description: Producción

security:
  - bearerAuth: []

tags:
  - name: Users
  - name: Trips
  - name: Events
  - name: Budget
  - name: Documents
  - name: Wishlist
  - name: Suggestions
  - name: Gaps
  - name: Export
  - name: PaymentMethods
  - name: Flights
  - name: Travel Services
    description: eSIM and travel insurance
  - name: Sync
    description: Delta sync para clientes móviles offline-first
  - name: Subscriptions
    description: Gestión de suscripciones in-app (Apple / Google / Stripe via RevenueCat)
  - name: Notifications
    description: Registro y revocación de tokens FCM para push notifications

paths:

  # ── USERS ─────────────────────────────────────────────────
  /v1/users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Perfil del usuario autenticado
      responses:
        "200": { $ref: '#/components/responses/UserResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

    put:
      tags: [Users]
      operationId: updateMe
      summary: Actualizar perfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        "200": { $ref: '#/components/responses/UserResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /v1/users/me/preferences:
    put:
      tags: [Users]
      operationId: updatePreferences
      summary: Actualizar preferencias del usuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserPreferencesRequest' }
      responses:
        "200": { $ref: '#/components/responses/UserResponse' }

  # ── TRIPS ──────────────────────────────────────────────────
  /v1/trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: Listar viajes del usuario
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          schema: { type: string, enum: [PLANNING, ACTIVE, COMPLETED, ARCHIVED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPage' }

    post:
      tags: [Trips]
      operationId: createTrip
      summary: Crear un viaje
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripRequest' }
      responses:
        "201": { $ref: '#/components/responses/TripResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /v1/trips/{tripId}:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Detalle de un viaje
      responses:
        "200": { $ref: '#/components/responses/TripResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Trips]
      operationId: updateTrip
      summary: Actualizar un viaje
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTripRequest' }
      responses:
        "200": { $ref: '#/components/responses/TripResponse' }
    delete:
      tags: [Trips]
      operationId: deleteTrip
      summary: Eliminar un viaje
      responses:
        "204": { description: Eliminado }
        "403": { $ref: '#/components/responses/Forbidden' }

  /v1/trips/{tripId}/publish:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    post:
      tags: [Trips]
      operationId: publishTrip
      summary: Publicar itinerario (genera URL pública)
      responses:
        "200": { $ref: '#/components/responses/TripResponse' }

  /v1/trips/public/{slug}:
    get:
      tags: [Trips]
      operationId: getPublicTrip
      summary: Itinerario público (sin autenticación)
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: '#/components/responses/TripResponse' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── EVENTS ─────────────────────────────────────────────────
  /v1/trips/{tripId}/events:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Events]
      operationId: listEvents
      summary: Eventos del viaje
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [FLIGHT, ACCOMMODATION, ACTIVITY, TRANSPORT, CUSTOM, DESTINATION, ESIM, INSURANCE] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [CONFIRMED, TENTATIVE, CANCELLED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventResponse' }

    post:
      tags: [Events]
      operationId: createEvent
      summary: Crear evento manualmente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        "201": { $ref: '#/components/responses/EventResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409":
          description: Conflicto de horario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/trips/{tripId}/events/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - { $ref: '#/components/parameters/EventId' }
    get:
      tags: [Events]
      operationId: getEvent
      summary: Detalle de un evento
      responses:
        "200": { $ref: '#/components/responses/EventResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Actualizar un evento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventRequest' }
      responses:
        "200": { $ref: '#/components/responses/EventResponse' }
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Eliminar un evento
      responses:
        "204": { description: Eliminado }

  /v1/trips/{tripId}/events/by-day:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Events]
      operationId: getEventsByDay
      summary: Eventos agrupados por día — mapa fecha→lista
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/EventResponse' }

  /v1/trips/{tripId}/events/days:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Events]
      operationId: getTripDays
      summary: Resumen de días — ocupación y huecos libres
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TripDaySummary' }

  # ── BUDGET ─────────────────────────────────────────────────
  /v1/trips/{tripId}/budget:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Budget]
      operationId: getBudget
      summary: Presupuesto completo del viaje
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetResponse' }

  /v1/trips/{tripId}/budget/summary:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Budget]
      operationId: getBudgetSummary
      summary: Resumen por categoría (estimado vs real)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BudgetCategorySummary' }

  /v1/trips/{tripId}/budget/timeline:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Budget]
      operationId: getBudgetTimeline
      summary: Gastos ordenados por fecha prevista de pago
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BudgetItemResponse' }

  /v1/trips/{tripId}/budget/items:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    post:
      tags: [Budget]
      operationId: addBudgetItem
      summary: Añadir gasto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBudgetItemRequest' }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetItemResponse' }

  /v1/trips/{tripId}/budget/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Budget]
      operationId: updateBudgetItem
      summary: Actualizar gasto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBudgetItemRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetItemResponse' }
    delete:
      tags: [Budget]
      operationId: deleteBudgetItem
      summary: Eliminar gasto
      responses:
        "204": { description: Eliminado }

  # ── DOCUMENTS ──────────────────────────────────────────────
  /v1/trips/{tripId}/documents:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Documentos del viaje
      parameters:
        - name: type
          in: query
          schema: { type: string }
          description: Filtrar por tipo de documento
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentResponse' }
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Subir documento
      parameters:
        - name: documentTypeId
          in: query
          required: true
          schema: { type: string }
          description: "Tipo de documento (ej: flight_ticket, hotel_booking, passport)"
        - name: displayName
          in: query
          schema: { type: string }
          description: Nombre descriptivo del documento
        - name: validFrom
          in: query
          schema: { type: string, format: date }
        - name: validUntil
          in: query
          schema: { type: string, format: date }
        - name: notes
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Aceptado — parsing en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentResponse' }

  /v1/trips/{tripId}/documents/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - { $ref: '#/components/parameters/DocumentId' }
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Estado del documento y datos parseados
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentResponse' }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Eliminar documento
      responses:
        "204": { description: Eliminado }

  /v1/trips/{tripId}/documents/{documentId}/accept:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - { $ref: '#/components/parameters/DocumentId' }
    post:
      tags: [Documents]
      operationId: acceptDocument
      summary: Confirmar eventos parseados del PDF
      responses:
        "200":
          description: Eventos creados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventResponse' }

  # ── WISHLIST ───────────────────────────────────────────────
  /v1/trips/{tripId}/wishlist:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Wishlist]
      operationId: listWishlist
      summary: Lista de deseos del viaje
      parameters:
        - name: city
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WishlistItemResponse' }
    post:
      tags: [Wishlist]
      operationId: addWishlistItem
      summary: Añadir ítem a la wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWishlistItemRequest' }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistItemResponse' }

  /v1/trips/{tripId}/wishlist/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Wishlist]
      operationId: deleteWishlistItem
      summary: Eliminar ítem de la wishlist
      responses:
        "204": { description: Eliminado }

  /v1/trips/{tripId}/wishlist/{itemId}/schedule:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Wishlist]
      operationId: scheduleWishlistItem
      summary: Convertir wishlist item en evento del calendario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDatetime]
              properties:
                startDatetime: { type: string, format: date-time }
                endDatetime:   { type: string, format: date-time }
      responses:
        "201": { $ref: '#/components/responses/EventResponse' }

  # ── SUGGESTIONS ────────────────────────────────────────────
  /v1/trips/{tripId}/suggestions:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Suggestions]
      operationId: getSuggestions
      summary: Sugerencias IA para un día del viaje
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SuggestionResponse' }

  /v1/trips/{tripId}/suggestions/{suggestionId}/accept:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - { $ref: '#/components/parameters/SuggestionId' }
    post:
      tags: [Suggestions]
      operationId: acceptSuggestion
      summary: Aceptar sugerencia — crea evento en el calendario
      responses:
        "201": { $ref: '#/components/responses/EventResponse' }

  /v1/trips/{tripId}/suggestions/{suggestionId}/dismiss:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - { $ref: '#/components/parameters/SuggestionId' }
    post:
      tags: [Suggestions]
      operationId: dismissSuggestion
      summary: Descartar sugerencia
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "204": { description: Descartada }

  # ── GAPS ───────────────────────────────────────────────────
  /v1/trips/{tripId}/gaps:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    get:
      tags: [Gaps]
      operationId: listGaps
      summary: Gaps e inconsistencias detectados en el itinerario
      parameters:
        - name: onlyOpen
          in: query
          schema: { type: boolean, default: true }
          description: Si true, devuelve solo gaps con status OPEN
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GapResponse' }

  /v1/trips/{tripId}/gaps/recalculate:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    post:
      tags: [Gaps]
      operationId: recalculateGaps
      summary: Forzar recálculo de gaps del viaje
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GapResponse' }

  /v1/trips/{tripId}/gaps/{gapId}/snooze:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - { $ref: '#/components/parameters/GapId' }
    post:
      tags: [Gaps]
      operationId: snoozeGap
      summary: Posponer un gap hasta una fecha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until:
                  type: string
                  format: date-time
                  description: Fecha hasta la que se pospone el gap
                  example: "2025-08-01T00:00:00Z"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GapResponse' }

  /v1/trips/{tripId}/gaps/{gapId}/ignore:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
      - { $ref: '#/components/parameters/GapId' }
    post:
      tags: [Gaps]
      operationId: ignoreGap
      summary: Ignorar un gap con motivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Motivo por el que se ignora el gap
                  example: "Ya tengo alojamiento reservado fuera de la app"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GapResponse' }

  # ── EXPORT ─────────────────────────────────────────────────
  /v1/trips/{tripId}/export:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    post:
      tags: [Export]
      operationId: requestExport
      summary: Solicitar exportación del itinerario en PDF (asíncrono)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportOptionsRequest' }
      responses:
        "200":
          description: Exportación iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }

  # ── PAYMENT METHODS ───────────────────────────────────────
  /v1/payment-methods:
    get:
      tags: [PaymentMethods]
      operationId: listPaymentMethods
      summary: Medios de pago del usuario
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentMethodResponse' }
    post:
      tags: [PaymentMethods]
      operationId: createPaymentMethod
      summary: Crear medio de pago
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentMethodRequest' }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethodResponse' }

  # ── FLIGHTS ────────────────────────────────────────────────
  /v1/flights/lookup:
    get:
      tags: [Flights]
      operationId: lookupFlight
      summary: Lookup flight details by IATA flight number and date
      description: Proxy to AeroDataBox. Returns scheduled departure/arrival info to auto-fill the event form. Disabled in non-production environments.
      parameters:
        - name: flightNumber
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 10, example: "IB1234" }
          description: IATA flight number (e.g. IB1234)
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: "2025-07-15" }
          description: Flight date in ISO 8601 format (YYYY-MM-DD)
      responses:
        "200":
          description: Flight details found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightLookupResponse' }
        "404":
          description: Flight not found
        "503":
          description: Flight lookup is disabled in this environment
      security:
        - bearerAuth: []

  /v1/payment-methods/{methodId}:
    parameters:
      - name: methodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [PaymentMethods]
      operationId: updatePaymentMethod
      summary: Actualizar medio de pago
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePaymentMethodRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethodResponse' }
    delete:
      tags: [PaymentMethods]
      operationId: deletePaymentMethod
      summary: Eliminar medio de pago
      responses:
        "204": { description: Eliminado }

  /v1/payment-methods/report/{tripId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Viaje para el que se genera el reporte
    get:
      tags: [PaymentMethods]
      operationId: getPaymentMethodReport
      summary: Reporte de gastos agrupados por medio de pago
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentMethodReportResponse' }

  # ── FEATURES (mobile feature flags) ──────────────────────
  /v1/me/features:
    get:
      tags: [Users]
      operationId: getMyFeatures
      summary: Feature flags activos para el usuario autenticado
      description: Devuelve los feature flags calculados según el plan del usuario y los desbloqueos temporales activos por rewarded ads.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserFeaturesResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── SYNC ──────────────────────────────────────────────────
  /v1/sync:
    get:
      tags: [Sync]
      operationId: deltaSync
      summary: Delta sync para cliente móvil offline-first
      description: Devuelve entidades modificadas o borradas desde el timestamp indicado. Usar el campo `syncedAt` de la respuesta como `since` en la siguiente llamada.
      parameters:
        - name: since
          in: query
          required: true
          description: Timestamp ISO 8601 desde el que calcular el delta
          schema:
            type: string
            format: date-time
            example: "2026-08-01T00:00:00Z"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── TRIP SHARE ────────────────────────────────────────────
  /v1/trips/{tripId}/share:
    parameters:
      - { $ref: '#/components/parameters/TripId' }
    post:
      tags: [Trips]
      operationId: shareTrip
      summary: Genera deep link para compartir el viaje
      description: Genera un Universal Link (iOS) / App Link (Android). Si el receptor no tiene la app instalada, redirige al itinerario web público.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareTripResponse' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── INVITES ───────────────────────────────────────────────
  /v1/me/invites:
    get:
      tags: [Users]
      operationId: listMyInvites
      summary: Invitaciones pendientes a viajes compartidos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 100
                items: { $ref: '#/components/schemas/TripInviteResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: Token de invitación recibido por email o deep link
        schema: { type: string, minLength: 1, maxLength: 200, example: "inv_abc123xyz" }
    post:
      tags: [Users]
      operationId: acceptInvite
      summary: Aceptar invitación a un viaje compartido
      responses:
        "200": { $ref: '#/components/responses/TripResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409":
          description: Invitación ya aceptada o expirada

  # ── SUBSCRIPTIONS ─────────────────────────────────────────
  /v1/subscriptions/me:
    get:
      tags: [Subscriptions]
      operationId: getMySubscription
      summary: Estado de la suscripción activa del usuario
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/subscriptions/verify:
    post:
      tags: [Subscriptions]
      operationId: verifySubscriptionReceipt
      summary: Verificar receipt de App Store o Google Play vía RevenueCat
      description: Valida el receipt con RevenueCat y actualiza el plan del usuario. Llamar tras completar una compra in-app.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyReceiptRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── DEVICE TOKENS (FCM) ───────────────────────────────────
  /v1/device-tokens:
    post:
      tags: [Notifications]
      operationId: registerDeviceToken
      summary: Registrar token FCM del dispositivo
      description: Llamar al iniciar sesión. Si ya existe un token para la plataforma del usuario, lo reemplaza.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceTokenRequest' }
      responses:
        "204": { description: Token registrado }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/device-tokens/{platform}:
    parameters:
      - name: platform
        in: path
        required: true
        description: Plataforma del token a revocar
        schema: { type: string, enum: [ios, android, web], example: "ios" }
    delete:
      tags: [Notifications]
      operationId: revokeDeviceToken
      summary: Revocar token FCM al cerrar sesión
      description: Marca el token de la plataforma indicada como inactivo para que no reciba más notificaciones push.
      responses:
        "204": { description: Token revocado }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── CONSENT (GDPR) ────────────────────────────────────────
  /v1/me/consent:
    get:
      tags: [Users]
      operationId: getMyConsent
      summary: Estado de consentimiento GDPR del usuario
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }

    put:
      tags: [Users]
      operationId: updateMyConsent
      summary: Actualizar consentimiento tras diálogo UMP
      description: Llamar tras mostrar el Google User Messaging Platform dialog con la respuesta del usuario. Debe llamarse incluso si el usuario deniega el consentimiento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateConsentRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }

  # ── REWARDED ADS ──────────────────────────────────────────
  /v1/me/rewarded-unlock:
    post:
      tags: [Users]
      operationId: rewardedUnlock
      summary: Registrar rewarded ad completado y desbloquear feature temporal
      description: Llamar después de que el usuario complete un anuncio recompensado. El backend registra el desbloqueo con TTL; el siguiente GET /v1/me/features lo reflejará.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewardedUnlockRequest' }
      responses:
        "200":
          description: Feature desbloqueada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardedUnlockResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

# ─────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GapId:
      name: gapId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    UserResponse:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UserResponse' }
    TripResponse:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TripResponse' }
    EventResponse:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EventResponse' }
    BadRequest:
      description: Validación fallida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token ausente o inválido
    Forbidden:
      description: Sin permisos sobre el recurso
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    # ── Shared ───────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        status:    { type: integer }
        error:     { type: string }
        details:   { type: object }
        timestamp: { type: string, format: date-time }

    PageMeta:
      type: object
      properties:
        totalElements: { type: integer, format: int64 }
        totalPages:    { type: integer }
        number:        { type: integer }
        size:          { type: integer }

    # ── Users ─────────────────────────────────────────────────
    UserResponse:
      type: object
      properties:
        id:             { type: string, format: uuid }
        email:          { type: string }
        name:           { type: string }
        avatarUrl:      { type: string }
        plan:           { type: string, enum: [free, premium] }
        planExpiresAt:  { type: string, format: date-time }

    UpdateUserRequest:
      type: object
      properties:
        name:      { type: string, maxLength: 120 }
        avatarUrl: { type: string }

    UpdateUserPreferencesRequest:
      type: object
      properties:
        interests:   { type: array, items: { type: string } }
        foodProfile: { type: string, description: "Perfil gastronómico del usuario (ej: normal, foodie, gourmet)" }
        travelStyle: { type: string, enum: [slow, moderate, intense] }
        budgetLevel: { type: string, enum: [budget, mid, mid-high, luxury] }
        language:    { type: string, minLength: 2, maxLength: 5 }
        currency:    { type: string, minLength: 3, maxLength: 3 }

    # ── Trips ─────────────────────────────────────────────────
    TripResponse:
      type: object
      properties:
        id:            { type: string, format: uuid }
        title:         { type: string }
        description:   { type: string }
        status:        { type: string, enum: [PLANNING, ACTIVE, COMPLETED, ARCHIVED] }
        startDate:     { type: string, format: date }
        endDate:       { type: string, format: date }
        baseCurrency:  { type: string }
        isPublic:      { type: boolean }
        publicSlug:    { type: string }
        coverImageUrl: { type: string }
        createdAt:     { type: string, format: date-time }

    TripPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/TripResponse' }

    CreateTripRequest:
      type: object
      required: [title, startDate, endDate]
      properties:
        title:        { type: string, minLength: 1, maxLength: 120 }
        description:  { type: string }
        startDate:    { type: string, format: date }
        endDate:      { type: string, format: date }
        baseCurrency: { type: string, pattern: '^[A-Z]{3}$', default: EUR }

    UpdateTripRequest:
      type: object
      properties:
        title:         { type: string, maxLength: 120 }
        description:   { type: string }
        startDate:     { type: string, format: date }
        endDate:       { type: string, format: date }
        baseCurrency:  { type: string }
        coverImageUrl: { type: string }
        status:        { type: string, enum: [PLANNING, ACTIVE, COMPLETED, ARCHIVED] }

    # ── Events ────────────────────────────────────────────────
    EventResponse:
      oneOf:
        - $ref: '#/components/schemas/FlightEventResponse'
        - $ref: '#/components/schemas/AccommodationEventResponse'
        - $ref: '#/components/schemas/ActivityEventResponse'
        - $ref: '#/components/schemas/TransportEventResponse'
        - $ref: '#/components/schemas/CustomEventResponse'
        - $ref: '#/components/schemas/DestinationEventResponse'
        - $ref: '#/components/schemas/EsimEventResponse'
        - $ref: '#/components/schemas/InsuranceEventResponse'
      discriminator:
        propertyName: type
        mapping:
          FLIGHT:        '#/components/schemas/FlightEventResponse'
          ACCOMMODATION: '#/components/schemas/AccommodationEventResponse'
          ACTIVITY:      '#/components/schemas/ActivityEventResponse'
          TRANSPORT:     '#/components/schemas/TransportEventResponse'
          CUSTOM:        '#/components/schemas/CustomEventResponse'
          DESTINATION:   '#/components/schemas/DestinationEventResponse'
          ESIM:          '#/components/schemas/EsimEventResponse'
          INSURANCE:     '#/components/schemas/InsuranceEventResponse'

    EventResponseBase:
      type: object
      properties:
        id:            { type: string, format: uuid }
        tripId:        { type: string, format: uuid }
        documentId:    { type: string, format: uuid }
        type:          { type: string, enum: [FLIGHT, ACCOMMODATION, ACTIVITY, TRANSPORT, CUSTOM, DESTINATION, ESIM, INSURANCE] }
        title:         { type: string, minLength: 1, maxLength: 200 }
        notes:         { type: string, maxLength: 2000 }
        color:         { type: string, minLength: 7, maxLength: 7 }
        startDatetime: { type: string, format: date-time }
        endDatetime:   { type: string, format: date-time }
        allDay:        { type: boolean }
        timezone:      { type: string, minLength: 1, maxLength: 60 }
        status:        { type: string, enum: [CONFIRMED, TENTATIVE, CANCELLED] }
        source:        { type: string, enum: [MANUAL, PDF_IMPORT, AI_SUGGESTION] }
        locationName:  { type: string, maxLength: 200 }
        latitude:      { type: number, minimum: -90, maximum: 90 }
        longitude:     { type: number, minimum: -180, maximum: 180 }

    FlightEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'
        - type: object
          properties:
            flight: { $ref: '#/components/schemas/FlightDetail' }

    AccommodationEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'
        - type: object
          properties:
            accommodation: { $ref: '#/components/schemas/AccommodationDetail' }

    ActivityEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'
        - type: object
          properties:
            activity: { $ref: '#/components/schemas/ActivityDetail' }

    TransportEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'
        - type: object
          properties:
            transport: { $ref: '#/components/schemas/TransportDetail' }

    CustomEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'

    DestinationEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'

    CreateEventRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateFlightEventRequest'
        - $ref: '#/components/schemas/CreateAccommodationEventRequest'
        - $ref: '#/components/schemas/CreateActivityEventRequest'
        - $ref: '#/components/schemas/CreateTransportEventRequest'
        - $ref: '#/components/schemas/CreateCustomEventRequest'
        - $ref: '#/components/schemas/CreateDestinationEventRequest'
        - $ref: '#/components/schemas/CreateEsimEventRequest'
        - $ref: '#/components/schemas/CreateInsuranceEventRequest'
      discriminator:
        propertyName: type
        mapping:
          FLIGHT:        '#/components/schemas/CreateFlightEventRequest'
          ACCOMMODATION: '#/components/schemas/CreateAccommodationEventRequest'
          ACTIVITY:      '#/components/schemas/CreateActivityEventRequest'
          TRANSPORT:     '#/components/schemas/CreateTransportEventRequest'
          CUSTOM:        '#/components/schemas/CreateCustomEventRequest'
          DESTINATION:   '#/components/schemas/CreateDestinationEventRequest'
          ESIM:          '#/components/schemas/CreateEsimEventRequest'
          INSURANCE:     '#/components/schemas/CreateInsuranceEventRequest'

    EventBase:
      type: object
      required: [type, title, startDatetime]
      properties:
        type:          { type: string, enum: [FLIGHT, ACCOMMODATION, ACTIVITY, TRANSPORT, CUSTOM, DESTINATION, ESIM, INSURANCE] }
        title:         { type: string, minLength: 1, maxLength: 200 }
        notes:         { type: string, maxLength: 2000 }
        color:         { type: string, pattern: '^#[0-9A-Fa-f]{6}$', minLength: 7, maxLength: 7 }
        startDatetime: { type: string, format: date-time }
        endDatetime:   { type: string, format: date-time }
        allDay:        { type: boolean, default: false }
        timezone:      { type: string, minLength: 1, maxLength: 60, default: Europe/Madrid }
        locationName:  { type: string, maxLength: 200 }
        latitude:      { type: number, minimum: -90, maximum: 90 }
        longitude:     { type: number, minimum: -180, maximum: 180 }
        scheduledPayAt: { type: string, format: date-time }

    CreateFlightEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [flight]
          properties:
            flight: { $ref: '#/components/schemas/FlightDetail' }

    CreateAccommodationEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [accommodation]
          properties:
            accommodation: { $ref: '#/components/schemas/AccommodationDetail' }

    CreateActivityEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [activity]
          properties:
            activity: { $ref: '#/components/schemas/ActivityDetail' }

    CreateTransportEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [transport]
          properties:
            transport: { $ref: '#/components/schemas/TransportDetail' }

    CreateCustomEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'

    CreateDestinationEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'

    UpdateEventRequest:
      type: object
      properties:
        title:         { type: string, maxLength: 200 }
        notes:         { type: string, maxLength: 2000 }
        color:         { type: string, minLength: 7, maxLength: 7 }
        startDatetime: { type: string, format: date-time }
        endDatetime:   { type: string, format: date-time }
        status:        { type: string, enum: [CONFIRMED, TENTATIVE, CANCELLED] }
        locationName:  { type: string, maxLength: 200 }
        latitude:      { type: number, minimum: -90, maximum: 90 }
        longitude:     { type: number, minimum: -180, maximum: 180 }
        flight:        { $ref: '#/components/schemas/FlightDetail' }
        accommodation: { $ref: '#/components/schemas/AccommodationDetail' }
        activity:      { $ref: '#/components/schemas/ActivityDetail' }
        transport:     { $ref: '#/components/schemas/TransportDetail' }
        esim:          { $ref: '#/components/schemas/EsimDetail' }
        insurance:     { $ref: '#/components/schemas/InsuranceDetail' }

    FlightDetail:
      type: object
      properties:
        airline:              { type: string, minLength: 1, maxLength: 100 }
        flightNumber:         { type: string, minLength: 2, maxLength: 10 }
        originCity:           { type: string, maxLength: 100 }
        originIata:           { type: string, minLength: 3, maxLength: 3 }
        originTerminal:       { type: string, maxLength: 10 }
        destinationCity:      { type: string, maxLength: 100 }
        destinationIata:      { type: string, minLength: 3, maxLength: 3 }
        destinationTerminal:  { type: string, maxLength: 10 }
        seat:                 { type: string, maxLength: 5 }
        cabinClass:           { type: string, enum: [economy, premium_economy, business, first] }
        bookingRef:           { type: string, maxLength: 20 }
        baggageAllowance:     { type: string, maxLength: 50 }
        purchaseStatus:       { type: string, enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED] }
        priceAmount:          { type: number, minimum: 0, maximum: 99999.99 }
        priceCurrency:        { type: string, minLength: 3, maxLength: 3 }
        pricePerPerson:       { type: boolean }
        numPassengers:        { type: integer, minimum: 1, maximum: 9 }
        cancellationDeadline: { type: string, format: date-time }
        purchasedAt:          { type: string, format: date-time }
        paymentMethodId:      { type: string, format: uuid }

    AccommodationDetail:
      type: object
      required: [name]
      properties:
        name:                  { type: string, minLength: 1, maxLength: 200 }
        accommodationType:     { type: string, enum: [hotel, apartment, hostel, airbnb, other] }
        address:               { type: string, maxLength: 300 }
        city:                  { type: string, maxLength: 100 }
        country:               { type: string, maxLength: 100 }
        bookingRef:            { type: string, maxLength: 50 }
        bookingPlatform:       { type: string, maxLength: 100 }
        includesBreakfast:     { type: boolean }
        purchaseStatus:        { type: string, enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED] }
        pricePerNight:         { type: number, minimum: 0, maximum: 99999.99 }
        totalPrice:            { type: number, minimum: 0, maximum: 999999.99 }
        priceCurrency:         { type: string, minLength: 3, maxLength: 3 }
        freeCancellationUntil: { type: string, format: date-time }
        purchasedAt:           { type: string, format: date-time }
        paymentMethodId:       { type: string, format: uuid }

    ActivityDetail:
      type: object
      properties:
        venueName:       { type: string, maxLength: 200 }
        address:         { type: string, maxLength: 300 }
        city:            { type: string, maxLength: 100 }
        category:        { type: string, maxLength: 100 }
        bookingRef:      { type: string, maxLength: 50 }
        ticketUrl:       { type: string, maxLength: 500 }
        numPeople:       { type: integer, minimum: 1, maximum: 99 }
        externalPlaceId: { type: string, maxLength: 100 }
        rating:          { type: number, minimum: 0, maximum: 5 }
        websiteUrl:      { type: string, maxLength: 500 }
        purchaseStatus:  { type: string, enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED] }
        priceAmount:     { type: number, minimum: 0, maximum: 9999.99 }
        priceCurrency:   { type: string, minLength: 3, maxLength: 3 }
        paymentMethodId: { type: string, format: uuid }

    TransportDetail:
      type: object
      properties:
        transportType:       { type: string, enum: [train, bus, car_rental, taxi, ferry, metro, other] }
        provider:            { type: string, maxLength: 100 }
        originName:          { type: string, maxLength: 200 }
        originAddress:       { type: string, maxLength: 300 }
        destinationName:     { type: string, maxLength: 200 }
        destinationAddress:  { type: string, maxLength: 300 }
        bookingRef:          { type: string, maxLength: 50 }
        seatNumber:          { type: string, maxLength: 10 }
        vehicleDetails:      { type: string, maxLength: 200 }
        purchaseStatus:      { type: string, enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED] }
        priceAmount:         { type: number, minimum: 0, maximum: 9999.99 }
        priceCurrency:       { type: string, minLength: 3, maxLength: 3 }
        paymentMethodId:     { type: string, format: uuid }

    TripDaySummary:
      type: object
      properties:
        date:            { type: string, format: date }
        destinationCity: { type: string }
        latitude:        { type: number }
        longitude:       { type: number }
        occupancy:       { type: string, enum: [free, partial, full] }
        freeSlots:
          type: array
          items:
            type: object
            properties:
              from: { type: string, pattern: '^\d{2}:\d{2}$' }
              to:   { type: string, pattern: '^\d{2}:\d{2}$' }
        eventCount: { type: integer }

    # ── Budget ────────────────────────────────────────────────
    BudgetResponse:
      type: object
      properties:
        id:               { type: string, format: uuid }
        tripId:           { type: string, format: uuid }
        currency:         { type: string }
        totalLimit:       { type: number }
        totalEstimated:   { type: number }
        totalActual:      { type: number }
        percentageUsed:   { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/BudgetItemResponse' }

    BudgetItemResponse:
      type: object
      properties:
        id:                  { type: string, format: uuid }
        budgetId:            { type: string, format: uuid }
        eventId:             { type: string, format: uuid }
        eventTitle:          { type: string, maxLength: 200 }
        bookingStatus:       { type: string, enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED] }
        category:            { type: string, enum: [TRANSPORT, ACCOMMODATION, FOOD, ACTIVITIES, SHOPPING, OTHER] }
        description:         { type: string, minLength: 1, maxLength: 300 }
        amountEstimated:     { type: number, minimum: 0, maximum: 999999.99 }
        amountActual:        { type: number, minimum: 0, maximum: 999999.99 }
        currency:            { type: string, minLength: 3, maxLength: 3 }
        paid:                { type: boolean }
        paidAt:              { type: string, format: date-time }
        notes:               { type: string, maxLength: 1000 }
        paymentMethodId:     { type: string, format: uuid }
        scheduledPayAt:      { type: string, format: date-time }
        reminderHoursBefore: { type: integer, minimum: 1, maximum: 720 }

    BudgetCategorySummary:
      type: object
      properties:
        category:       { type: string }
        estimated:      { type: number }
        actual:         { type: number }
        numItems:       { type: integer }
        numPaid:        { type: integer }
        percentageUsed: { type: number }

    CreateBudgetItemRequest:
      type: object
      required: [category, description, amountEstimated]
      properties:
        eventId:             { type: string, format: uuid }
        category:            { type: string, enum: [TRANSPORT, ACCOMMODATION, FOOD, ACTIVITIES, SHOPPING, OTHER] }
        description:         { type: string, minLength: 1, maxLength: 300 }
        amountEstimated:     { type: number, minimum: 0, maximum: 999999.99 }
        currency:            { type: string, minLength: 3, maxLength: 3, default: EUR }
        notes:               { type: string, maxLength: 1000 }
        paymentMethodId:     { type: string, format: uuid }
        scheduledPayAt:      { type: string, format: date-time }
        reminderHoursBefore: { type: integer, minimum: 1, maximum: 720 }

    UpdateBudgetItemRequest:
      type: object
      properties:
        description:         { type: string, minLength: 1, maxLength: 300 }
        amountEstimated:     { type: number, minimum: 0, maximum: 999999.99 }
        amountActual:        { type: number, minimum: 0, maximum: 999999.99 }
        isPaid:              { type: boolean }
        notes:               { type: string, maxLength: 1000 }
        paymentMethodId:     { type: string, format: uuid }
        scheduledPayAt:      { type: string, format: date-time }
        reminderHoursBefore: { type: integer, minimum: 1, maximum: 720 }

    # ── Documents ─────────────────────────────────────────────
    DocumentResponse:
      type: object
      properties:
        id:             { type: string, format: uuid }
        tripId:         { type: string, format: uuid }
        uploadedBy:     { type: string, format: uuid }
        documentTypeId: { type: string }
        displayName:    { type: string }
        fileName:       { type: string }
        fileUrl:        { type: string }
        fileSizeBytes:  { type: integer, format: int64 }
        fileType:       { type: string }
        parseStatus:    { type: string, enum: [PENDING, PROCESSING, DONE, FAILED, NOT_REQUIRED] }
        rawExtracted:   { type: string }
        parsedData:     { type: object }
        parseError:     { type: string }
        validFrom:      { type: string, format: date }
        validUntil:     { type: string, format: date }
        notes:          { type: string }
        uploadedAt:     { type: string, format: date-time }
        expiringSoon:   { type: boolean }
        expired:        { type: boolean }

    # ── Wishlist ──────────────────────────────────────────────
    WishlistItemResponse:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        name:               { type: string }
        category:           { type: string }
        destinationCity:    { type: string }
        latitude:           { type: number }
        longitude:          { type: number }
        priority:           { type: integer, enum: [1, 2, 3] }
        rating:             { type: number }
        estimatedCost:      { type: number }
        websiteUrl:         { type: string }
        convertedToEventId: { type: string, format: uuid }

    CreateWishlistItemRequest:
      type: object
      required: [name]
      properties:
        name:            { type: string, minLength: 1 }
        category:        { type: string }
        destinationCity: { type: string }
        latitude:        { type: number }
        longitude:       { type: number }
        priority:        { type: integer, enum: [1, 2, 3], default: 2 }
        externalPlaceId: { type: string }
        websiteUrl:      { type: string }
        estimatedCost:   { type: number }

    # ── Suggestions ───────────────────────────────────────────
    SuggestionResponse:
      type: object
      properties:
        id:                   { type: string, format: uuid }
        name:                 { type: string }
        category:             { type: string }
        description:          { type: string }
        reasoning:            { type: string }
        estimatedDurationMin: { type: integer }
        estimatedCostEur:     { type: number }
        bestTimeOfDay:        { type: string, enum: [morning, afternoon, evening, any] }
        latitude:             { type: number }
        longitude:            { type: number }
        websiteUrl:           { type: string }
        source:               { type: string, enum: [ai_generated, places_api, ticketmaster] }
        status:               { type: string, enum: [pending, accepted, dismissed] }

    # ── Gaps ──────────────────────────────────────────────────
    GapResponse:
      type: object
      properties:
        id:             { type: string, format: uuid }
        tripId:         { type: string, format: uuid }
        gapType:
          type: string
          enum:
            - NO_TRANSPORT_BETWEEN_DESTINATIONS
            - ARRIVAL_WITHOUT_ACCOMMODATION
            - DAYS_WITHOUT_ACCOMMODATION
            - TRANSPORT_ONLY_DRAFT
            - PENDING_PAYMENT_DEADLINE
            - CANCELLATION_DEADLINE_NEAR
            - TIGHT_CONNECTION
            - FREE_DAYS
        severity:         { type: string, enum: [ERROR, WARNING, INFO] }
        affectedFrom:     { type: string, format: date }
        affectedTo:       { type: string, format: date }
        originCity:       { type: string }
        originIata:       { type: string }
        destinationCity:  { type: string }
        destinationIata:  { type: string }
        eventIdFrom:      { type: string, format: uuid }
        eventIdTo:        { type: string, format: uuid }
        status:           { type: string, enum: [OPEN, RESOLVED, IGNORED, SNOOZED] }
        ignoredReason:    { type: string }
        snoozedUntil:     { type: string, format: date-time }
        suggestionText:   { type: string }
        detectedAt:       { type: string, format: date-time }
        resolvedAt:       { type: string, format: date-time }
        active:           { type: boolean }

    # ── Export ────────────────────────────────────────────────
    ExportOptionsRequest:
      type: object
      properties:
        language:         { type: string, minLength: 2, maxLength: 5, default: es }
        includeBudget:    { type: boolean, default: false }
        includeMap:       { type: boolean, default: true }
        includeDocuments: { type: boolean, default: true }
        exportType:       { type: string, enum: [full_itinerary, summary, budget_only], default: full_itinerary }

    ExportResponse:
      type: object
      properties:
        status:      { type: string, enum: [queued, processing, ready, failed] }
        downloadUrl: { type: string }
        expiresAt:   { type: string, format: date-time }

    # ── Payment Methods ──────────────────────────────────────
    PaymentMethodResponse:
      type: object
      properties:
        id:     { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name:   { type: string }
        type:   { type: string, enum: [card, transfer, cash, crypto, other] }
        active: { type: boolean }
        notes:  { type: string }

    CreatePaymentMethodRequest:
      type: object
      required: [name, type]
      properties:
        name:  { type: string, minLength: 1, maxLength: 80 }
        type:  { type: string, enum: [card, transfer, cash, crypto, other] }
        notes: { type: string }

    UpdatePaymentMethodRequest:
      type: object
      properties:
        name:      { type: string, maxLength: 80 }
        notes:     { type: string }
        active:    { type: boolean }
        sortOrder: { type: integer }

    PaymentMethodReportResponse:
      type: object
      properties:
        paymentMethodId:   { type: string, format: uuid }
        paymentMethodName: { type: string }
        type:              { type: string }
        currency:          { type: string }
        totalConfirmed:    { type: number }
        totalReserved:     { type: number }
        totalPending:      { type: number }
        totalAll:          { type: number }
        numExpenses:       { type: integer }

    PurchaseStatus:
      type: string
      enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED]

    # ── Flights ───────────────────────────────────────────────
    FlightLookupResponse:
      type: object
      properties:
        airline:
          type: string
          maxLength: 100
          description: Airline name
          example: "Iberia"
        flightNumber:
          type: string
          maxLength: 10
          description: IATA flight number
          example: "IB1234"
        originIata:
          type: string
          minLength: 3
          maxLength: 3
          description: Origin airport IATA code
          example: "MAD"
        originCity:
          type: string
          maxLength: 100
          description: Origin city name
          example: "Madrid"
        destinationIata:
          type: string
          minLength: 3
          maxLength: 3
          description: Destination airport IATA code
          example: "BCN"
        destinationCity:
          type: string
          maxLength: 100
          description: Destination city name
          example: "Barcelona"
        scheduledDeparture:
          type: string
          format: date-time
          description: Scheduled departure time in UTC
          example: "2025-07-15T08:00:00Z"
        scheduledArrival:
          type: string
          format: date-time
          description: Scheduled arrival time in UTC
          example: "2025-07-15T09:05:00Z"
        status:
          type: string
          maxLength: 50
          description: Flight status
          example: "Scheduled"
        aircraftType:
          type: string
          maxLength: 50
          description: Aircraft ICAO type code
          example: "A320"

    # ── eSIM ──────────────────────────────────────────────────
    EsimDetail:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 100
          description: eSIM provider name
          example: "Airalo"
        dataAllowanceGb:
          type: number
          minimum: 0
          maximum: 999
          description: Data allowance in GB
          example: 5
        coverageRegion:
          type: string
          minLength: 1
          maxLength: 200
          description: Covered countries or region
          example: "Europe"
        activationCode:
          type: string
          minLength: 1
          maxLength: 500
          description: eSIM activation code (LPA or QR text)
          example: "LPA:1$..."
        activationDeadline:
          type: string
          format: date
          description: Last date to activate the eSIM
          example: "2025-07-20"
        purchaseStatus:
          type: string
          enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED]
          description: Current purchase status
          example: "CONFIRMED"
        priceAmount:
          type: number
          minimum: 0
          maximum: 9999
          description: Total price paid
          example: 14.99
        priceCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code
          example: "EUR"
        purchasePlatform:
          type: string
          minLength: 1
          maxLength: 100
          description: Platform where purchased
          example: "Airalo App"
        purchasedAt:
          type: string
          format: date-time
          description: Purchase timestamp
          example: "2025-06-01T10:00:00Z"

    EsimEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'
        - type: object
          properties:
            esim: { $ref: '#/components/schemas/EsimDetail' }

    CreateEsimEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            esim: { $ref: '#/components/schemas/EsimDetail' }

    # ── Insurance ─────────────────────────────────────────────
    InsuranceDetail:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 100
          description: Insurance provider name
          example: "Allianz Travel"
        policyNumber:
          type: string
          minLength: 1
          maxLength: 50
          description: Insurance policy number
          example: "POL-2025-123456"
        coverageType:
          type: string
          enum: [medical, cancellation, comprehensive, basic]
          description: Type of coverage
          example: "comprehensive"
        coverageAmountEur:
          type: number
          minimum: 0
          maximum: 9999999
          description: Maximum coverage amount in EUR
          example: 100000
        emergencyPhone:
          type: string
          minLength: 1
          maxLength: 30
          description: 24h emergency assistance phone
          example: "+34 900 123 456"
        deductibleAmount:
          type: number
          minimum: 0
          maximum: 99999
          description: Deductible/excess amount
          example: 150
        purchaseStatus:
          type: string
          enum: [DRAFT, PENDING, RESERVED, CONFIRMED, CANCELLED, REFUNDED]
          description: Current purchase status
          example: "CONFIRMED"
        priceAmount:
          type: number
          minimum: 0
          maximum: 99999
          description: Premium paid
          example: 45.00
        priceCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code
          example: "EUR"
        purchasedAt:
          type: string
          format: date-time
          description: Purchase timestamp
          example: "2025-06-01T10:00:00Z"
        beneficiaries:
          type: string
          minLength: 1
          maxLength: 500
          description: Insured persons names
          example: "Juan García, María López"

    InsuranceEventResponse:
      allOf:
        - $ref: '#/components/schemas/EventResponseBase'
        - type: object
          properties:
            insurance: { $ref: '#/components/schemas/InsuranceDetail' }

    CreateInsuranceEventRequest:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            insurance: { $ref: '#/components/schemas/InsuranceDetail' }

    # ── Features ──────────────────────────────────────────────
    UserFeaturesResponse:
      type: object
      properties:
        showAds:
          type: boolean
          description: Si el usuario debe ver publicidad (true para plan free, false para premium/pro)
          example: true
        aiSuggestions:
          type: boolean
          description: Si el usuario tiene acceso a sugerencias IA personalizadas
          example: false
        aiPdfParsing:
          type: boolean
          description: Si el usuario tiene acceso al parsing de PDFs con IA
          example: false
        multiTraveler:
          type: boolean
          description: Si el usuario puede crear viajes compartidos con otros usuarios
          example: false
        plan:
          type: string
          minLength: 2
          maxLength: 20
          enum: [free, premium, pro]
          description: Plan activo del usuario
          example: "free"
        planExpiresAt:
          type: string
          format: date-time
          description: Fecha de expiración del plan de pago (null si plan free)
          example: "2026-09-18T23:59:59Z"
        rewardedUnlocks:
          type: array
          minItems: 0
          maxItems: 20
          description: Desbloqueos temporales activos por rewarded ads
          items: { $ref: '#/components/schemas/ActiveRewardedUnlock' }

    ActiveRewardedUnlock:
      type: object
      properties:
        featureKey:
          type: string
          minLength: 1
          maxLength: 50
          description: Clave de la feature desbloqueada temporalmente
          example: "ai_suggestions"
        expiresAt:
          type: string
          format: date-time
          description: Momento en que expira el desbloqueo
          example: "2026-08-19T14:00:00Z"

    # ── Sync ──────────────────────────────────────────────────
    SyncResponse:
      type: object
      properties:
        syncedAt:
          type: string
          format: date-time
          description: Timestamp del servidor en el momento del sync. Usar como `since` en la siguiente llamada.
          example: "2026-08-18T12:00:00Z"
        updated:
          type: object
          description: Entidades modificadas o creadas desde `since`
          properties:
            trips:
              type: array
              minItems: 0
              maxItems: 1000
              items: { $ref: '#/components/schemas/TripResponse' }
            budgetItems:
              type: array
              minItems: 0
              maxItems: 5000
              items: { $ref: '#/components/schemas/BudgetItemResponse' }
            wishlistItems:
              type: array
              minItems: 0
              maxItems: 1000
              items: { $ref: '#/components/schemas/WishlistItemResponse' }
        deleted:
          type: object
          description: IDs de entidades soft-deleted desde `since`
          properties:
            tripIds:
              type: array
              minItems: 0
              maxItems: 1000
              items: { type: string, format: uuid }
              example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
            budgetItemIds:
              type: array
              minItems: 0
              maxItems: 5000
              items: { type: string, format: uuid }
              example: []
            wishlistItemIds:
              type: array
              minItems: 0
              maxItems: 1000
              items: { type: string, format: uuid }
              example: []

    # ── Share ─────────────────────────────────────────────────
    ShareTripResponse:
      type: object
      properties:
        deepLink:
          type: string
          minLength: 10
          maxLength: 500
          description: Universal Link (iOS) / App Link (Android) para abrir el viaje en la app
          example: "https://travelapp.com/trips/abc123"
        webUrl:
          type: string
          minLength: 10
          maxLength: 500
          description: URL de fallback que abre el itinerario en el navegador
          example: "https://travelapp.com/trips/public/japon-2026"
        expiresAt:
          type: string
          format: date-time
          description: Fecha de expiración del deep link (null si no expira)
          example: "2026-12-31T23:59:59Z"

    # ── Invites ───────────────────────────────────────────────
    TripInviteResponse:
      type: object
      properties:
        token:
          type: string
          minLength: 10
          maxLength: 200
          description: Token para aceptar con POST /v1/invites/{token}/accept
          example: "inv_abc123xyz"
        tripId:
          type: string
          format: uuid
          description: ID del viaje al que se invita
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        tripTitle:
          type: string
          minLength: 1
          maxLength: 120
          description: Título del viaje
          example: "Japón 2026"
        invitedBy:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre del usuario que envió la invitación
          example: "María García"
        expiresAt:
          type: string
          format: date-time
          description: Fecha límite para aceptar la invitación
          example: "2026-08-25T23:59:59Z"

    # ── Subscriptions ─────────────────────────────────────────
    SubscriptionResponse:
      type: object
      properties:
        planId:
          type: string
          minLength: 2
          maxLength: 20
          enum: [free, premium, pro]
          description: Plan contratado
          example: "premium"
        status:
          type: string
          minLength: 4
          maxLength: 10
          enum: [trial, active, cancelled, expired]
          description: Estado actual de la suscripción
          example: "active"
        store:
          type: string
          minLength: 5
          maxLength: 6
          enum: [apple, google, stripe]
          description: Tienda donde se realizó la compra
          example: "apple"
        autoRenew:
          type: boolean
          description: Si la suscripción se renueva automáticamente
          example: true
        startedAt:
          type: string
          format: date-time
          description: Fecha de inicio de la suscripción
          example: "2026-07-18T10:00:00Z"
        expiresAt:
          type: string
          format: date-time
          description: Fecha de expiración o próxima renovación
          example: "2026-09-18T10:00:00Z"
        trialEnd:
          type: string
          format: date
          description: Fecha de fin del período de prueba (null si no aplica)
          example: "2026-08-25"

    VerifyReceiptRequest:
      type: object
      required: [store, receiptData]
      properties:
        store:
          type: string
          minLength: 5
          maxLength: 6
          enum: [apple, google]
          description: Tienda de la que procede el receipt
          example: "apple"
        receiptData:
          type: string
          minLength: 1
          maxLength: 10000
          description: Receipt en base64 (Apple) o purchase token (Google) devuelto por el SDK de RevenueCat
          example: "MIIT..."
        productId:
          type: string
          minLength: 1
          maxLength: 100
          description: Product ID de la tienda
          example: "com.travelapp.premium.monthly"

    # ── Device Tokens ─────────────────────────────────────────
    RegisterDeviceTokenRequest:
      type: object
      required: [platform, fcmToken]
      properties:
        platform:
          type: string
          minLength: 3
          maxLength: 7
          enum: [ios, android, web]
          description: Plataforma del dispositivo
          example: "ios"
        fcmToken:
          type: string
          minLength: 10
          maxLength: 500
          description: Token FCM devuelto por Firebase SDK
          example: "dGhpcyBpcyBhIHRva2Vu..."
        deviceModel:
          type: string
          minLength: 1
          maxLength: 100
          description: Modelo del dispositivo (informativo)
          example: "iPhone 15 Pro"
        appVersion:
          type: string
          minLength: 1
          maxLength: 20
          description: Versión de la app instalada
          example: "1.0.0"

    # ── Consent ───────────────────────────────────────────────
    ConsentResponse:
      type: object
      properties:
        adsPersonalized:
          type: boolean
          description: Si el usuario ha consentido publicidad personalizada
          example: false
        analytics:
          type: boolean
          description: Si el usuario ha consentido el uso de analytics
          example: true
        consentVersion:
          type: string
          minLength: 1
          maxLength: 20
          description: Versión del formulario de consentimiento mostrado
          example: "1.0"
        consentedAt:
          type: string
          format: date-time
          description: Timestamp en que el usuario respondió al diálogo de consentimiento
          example: "2026-08-18T10:00:00Z"

    UpdateConsentRequest:
      type: object
      required: [adsPersonalized, analytics, consentVersion]
      properties:
        adsPersonalized:
          type: boolean
          description: Si el usuario consiente publicidad personalizada
          example: false
        analytics:
          type: boolean
          description: Si el usuario consiente analytics
          example: true
        consentVersion:
          type: string
          minLength: 1
          maxLength: 20
          description: Versión del formulario de consentimiento que se mostró
          example: "1.0"

    # ── Rewarded Unlocks ──────────────────────────────────────
    RewardedUnlockRequest:
      type: object
      required: [featureKey, ttlHours]
      properties:
        featureKey:
          type: string
          minLength: 1
          maxLength: 50
          enum: [ai_suggestions, ai_pdf_parsing]
          description: Clave de la feature a desbloquear temporalmente
          example: "ai_suggestions"
        ttlHours:
          type: integer
          minimum: 1
          maximum: 72
          description: Duración del desbloqueo en horas
          example: 24

    RewardedUnlockResponse:
      type: object
      properties:
        featureKey:
          type: string
          minLength: 1
          maxLength: 50
          description: Clave de la feature desbloqueada
          example: "ai_suggestions"
        unlockedAt:
          type: string
          format: date-time
          description: Timestamp del desbloqueo
          example: "2026-08-18T14:00:00Z"
        expiresAt:
          type: string
          format: date-time
          description: Timestamp de expiración del desbloqueo
          example: "2026-08-19T14:00:00Z"
