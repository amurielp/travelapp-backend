spring:
  application:
    name: travelapp-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/travelapp}
    username: ${DB_USER:travelapp}
    password: ${DB_PASSWORD:travelapp}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:travelapp}

server:
  port: ${PORT:8080}

ai:
  provider: ${AI_PROVIDER:mock}
  cache:
    enabled: ${AI_CACHE_ENABLED:true}
    ttl-seconds: 86400

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: /swagger-ui/oauth2-redirect.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: travelapp-api
      env: ${SPRING_PROFILES_ACTIVE:local}

travelapp:
  features:
    flight-lookup:
      enabled: false
      api-key: ""  # Set in application-prod.yml only — never commit real keys
      api-host: "aerodatabox.p.rapidapi.com"

logging:
  level:
    com.travelapp: INFO
    org.hibernate.SQL: WARN

# ─────────────────────────────────────────────────────────────
# Service URLs — sobreescritas por cada perfil de entorno.
# ─────────────────────────────────────────────────────────────
services:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
    retry:
      max-attempts: 2
      backoff-ms: 500
  travel-core:
    url: ${TRAVEL_CORE_URL:http://localhost:8080}
  google-places:
    url: https://maps.googleapis.com/maps/api
    api-key: ${GOOGLE_PLACES_API_KEY:}
  openweather:
    url: https://api.openweathermap.org/data/2.5
    api-key: ${OPENWEATHER_API_KEY:}
  ticketmaster:
    url: https://app.ticketmaster.com/discovery/v2
    api-key: ${TICKETMASTER_API_KEY:}
  open-exchange-rates:
    url: https://openexchangerates.org/api
    app-id: ${OPEN_EXCHANGE_RATES_APP_ID:}
